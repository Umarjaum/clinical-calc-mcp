[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "clinical-calc-mcp"
version = "0.2.0"
description = "Six validated local MCP tools for common clinical calculations and unit conversions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Clinical Calc MCP Contributors" }]
keywords = [
  "mcp",
  "model-context-protocol",
  "fastmcp",
  "clinical-calculations",
  "vital-signs",
  "unit-conversion",
  "healthcare",
  "nursing",
  "medical-education",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Typing :: Typed",
]
dependencies = [
  "fastmcp>=2.13,<5",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.16.8",
  "twine>=5.0",
]

[project.scripts]
clinical-calc-mcp = "clinical_calc_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Umarjaum/clinical-calc-mcp"
Repository = "https://github.com/Umarjaum/clinical-calc-mcp"
Issues = "https://github.com/Umarjaum/clinical-calc-mcp/issues"
Changelog = "https://github.com/Umarjaum/clinical-calc-mcp/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Umarjaum/clinical-calc-mcp#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_calc_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
